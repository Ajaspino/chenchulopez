name: Actualizar estatísticas

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Obter contadores
        run: node scripts/fetch-stats.mjs
      - name: Gardar se hai cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/data.json
          git diff --cached --quiet || git commit -m "chore: actualizar estatísticas [skip ci]"
          git push
